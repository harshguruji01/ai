# ==============================================================================
# NGINX REVERSE PROXY CONFIGURATION FOR GURUAI (ai.webguruji.online)
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name ai.webguruji.online;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ai.webguruji.online;

    # SSL Certificates (Managed via Certbot)
    # ssl_certificate /etc/letsencrypt/live/ai.webguruji.online/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/ai.webguruji.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Client Request Body Limits (Allows image uploads up to 15MB if expanded)
    client_max_body_size 15M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket & Streaming Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;

        # Client IP Preservation for Server-Side Rate Limiting
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CRITICAL FOR CHATGPT STREAMING: Disable Nginx Proxy Buffering
        # Allows SSE chunks (word-by-word streaming) to reach user browser in real-time
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Generous timeouts for long AI reasoning or image generation
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
    }
}
