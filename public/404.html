<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — GuruAI</title>
  <link rel="icon" type="image/png" href="logo.png" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&family=Fira+Code:wght@500&display=swap" rel="stylesheet" />
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // GitHub Pages Smart Route Resolution
    (function() {
      var path = window.location.pathname.replace(/\/$/, '');
      var segs = path.split('/').filter(Boolean);
      var lastSeg = segs[segs.length - 1];

      if (lastSeg === 'login') {
        window.location.replace('/login.html' + window.location.search + window.location.hash);
        return;
      }
      if (lastSeg === 'dashboard') {
        window.location.replace('/dashboard.html' + window.location.search + window.location.hash);
        return;
      }
      if (lastSeg === 'admin') {
        window.location.replace('/admin.html' + window.location.search + window.location.hash);
        return;
      }
    })();
  </script>
</head>
<body class="min-h-screen bg-[#030712] text-slate-100 flex flex-col items-center justify-center p-4 font-sans selection:bg-indigo-500 selection:text-white relative overflow-hidden">
  
  <div class="fixed -top-40 -left-40 w-96 h-96 bg-indigo-500/15 rounded-full blur-3xl pointer-events-none"></div>
  <div class="fixed -bottom-40 -right-40 w-96 h-96 bg-cyan-500/15 rounded-full blur-3xl pointer-events-none"></div>

  <div class="relative z-10 max-w-md w-full text-center space-y-6 p-8 rounded-3xl bg-[#090e17]/90 border border-slate-800 shadow-2xl backdrop-blur-xl">
    <div class="w-16 h-16 rounded-2xl bg-[#0A0E1A] border border-indigo-500/50 mx-auto flex items-center justify-center shadow-lg shadow-indigo-500/25 p-2">
      <img src="logo.png" alt="GuruAI Logo" class="w-full h-full object-cover rounded-xl" />
    </div>

    <div class="space-y-2">
      <span class="text-xs font-mono font-bold px-3 py-1 rounded-full bg-indigo-500/15 text-indigo-400 border border-indigo-500/30 uppercase tracking-widest">404 • Not Found</span>
      <h1 class="text-2xl font-bold font-heading text-white">Looking for something?</h1>
      <p class="text-xs sm:text-sm text-slate-400 leading-relaxed">The page you requested was not found or may have moved to a different path.</p>
    </div>

    <div class="pt-2 flex flex-col gap-2.5">
      <a href="index.html" class="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-indigo-600 via-indigo-500 to-cyan-500 hover:from-indigo-500 hover:to-cyan-400 text-white font-bold text-xs shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2 transition active:scale-[0.99]">
        <span>Return to GuruAI Chat</span>
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
      </a>

      <div class="grid grid-cols-2 gap-2 pt-1">
        <a href="dashboard.html" class="py-2.5 px-3 rounded-xl bg-slate-900 hover:bg-slate-800 border border-slate-700/80 text-xs font-semibold text-slate-300 hover:text-white transition text-center">
          User Dashboard
        </a>
        <a href="login.html" class="py-2.5 px-3 rounded-xl bg-slate-900 hover:bg-slate-800 border border-slate-700/80 text-xs font-semibold text-slate-300 hover:text-white transition text-center">
          Sign In
        </a>
      </div>
    </div>
  </div>

  <footer class="mt-8 text-center text-xs text-slate-500 relative z-10">
    GuruAI by HarshGuruJi • <a href="https://webguruji.online" class="underline hover:text-slate-400">webguruji.online</a>
  <!-- Hostinger Reach Onsite Tracking -->
  <script src="https://cdn-reach.hostinger.com/js/embed.js"></script>
</body>
</html>
