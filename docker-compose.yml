version: '3.8'

services:
  guruai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: guruai-app
    restart: unless-stopped
    ports:
      # Bind to localhost only; Nginx will reverse proxy public requests with SSL
      - "127.0.0.1:3000:3000"
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
