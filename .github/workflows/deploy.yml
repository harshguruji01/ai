name: GuruAI CI/CD - Test, Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Run Automated Tests & Next.js Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Automated Test Suite
        run: npm test

      - name: Verify Next.js Production Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}

  deploy:
    name: Deploy to Production VPS
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Execute Remote SSH Deployment
        uses: appleboy/ssh-action@v1.0.3
        continue-on-error: true # Prevents CI failure if secrets are not set yet
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            echo "🚀 Deploying GuruAI to production server..."
            
            # Create deployment directory if not exists
            APP_DIR="/var/www/guruai"
            if [ ! -d "$APP_DIR" ]; then
              echo "Cloning repository for the first time..."
              sudo mkdir -p $APP_DIR
              sudo chown -R $USER:$USER $APP_DIR
              git clone https://github.com/harshguruji01/ai.git $APP_DIR
            fi
            
            cd $APP_DIR
            
            # Pull latest changes
            echo "Pulling latest code from main..."
            git pull origin main
            
            # Build and restart Docker containers
            if command -v docker &> /dev/null && command -v docker-compose &> /dev/null || docker compose version &> /dev/null; then
              echo "Building and launching Docker container..."
              docker compose down --remove-orphans || true
              docker compose up -d --build
              echo "✅ Docker deployment completed successfully!"
            else
              echo "Docker not found, running with PM2 / Node.js..."
              npm ci --production=false
              npm run build
              pm2 restart guruai || pm2 start npm --name "guruai" -- start
              echo "✅ PM2 deployment completed successfully!"
            fi
